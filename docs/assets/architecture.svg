<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
  <title id="title">Claude Proxy Guard: checks before launch, WFP rules during use</title>
  <desc id="desc">An architecture diagram, not an application screenshot. Desktop or VS Code terminal launches a checked Claude process. WFP restricts listed executables to a local HTTP proxy. The proxy's upstream routing and unlisted processes remain separate responsibilities.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b2b"/><stop offset="1" stop-color="#182d3c"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#6fd6bd" stroke-width="1.5"/></marker>
    <style>
      text { font-family: Segoe UI, Arial, sans-serif; }
      .heading { fill: #f0f6fc; font-weight: 650; }
      .label { fill: #dce8f3; font-size: 17px; }
      .muted { fill: #a7bbcb; font-size: 14px; }
      .small { fill: #bdcdda; font-size: 13px; }
      .box { fill: #1d3446; stroke: #416174; stroke-width: 1.3; }
      .line { stroke: #6fd6bd; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="460" rx="20" fill="url(#bg)"/>
  <text x="40" y="48" class="heading" font-size="25">A checked entry point. A defined network boundary.</text>
  <text x="40" y="76" class="muted">Windows • native Claude Code • local HTTP proxy • no background supervisor</text>
  <rect x="40" y="110" width="1040" height="85" rx="12" fill="#142737" stroke="#355266"/>
  <text x="60" y="138" class="heading" font-size="15">BEFORE LAUNCH</text>
  <text x="60" y="170" class="label">Profile + program hashes</text>
  <path d="M275 164 H310" class="line"/>
  <text x="329" y="170" class="label">WFP policies</text>
  <path d="M450 164 H485" class="line"/>
  <text x="505" y="170" class="label">Proxy identity + config</text>
  <path d="M704 164 H739" class="line"/>
  <text x="760" y="170" class="label">Expected exit IPv4</text>
  <rect x="954" y="137" width="105" height="36" rx="18" fill="#254f48"/>
  <text x="1006" y="160" text-anchor="middle" fill="#a0f1d7" font-size="13">fail → stop</text>
  <rect x="40" y="228" width="178" height="97" rx="12" class="box"/>
  <text x="129" y="264" text-anchor="middle" class="heading" font-size="18">Your entry point</text>
  <text x="129" y="291" text-anchor="middle" class="muted">Desktop / VS Code CLI</text>
  <path d="M219 276 H259" class="line"/>
  <rect x="270" y="228" width="178" height="97" rx="12" class="box"/>
  <text x="359" y="264" text-anchor="middle" class="heading" font-size="18">Claude Code</text>
  <text x="359" y="291" text-anchor="middle" class="muted">Independent config</text>
  <path d="M449 276 H489" class="line"/>
  <rect x="500" y="221" width="174" height="111" rx="12" fill="#173e3b" stroke="#6fd6bd" stroke-width="1.6"/>
  <text x="587" y="258" text-anchor="middle" fill="#a0f1d7" font-weight="650" font-size="19">WFP boundary</text>
  <text x="587" y="283" text-anchor="middle" class="label">Listed exe paths</text>
  <text x="587" y="308" text-anchor="middle" class="small">Loopback TCP port only</text>
  <path d="M675 276 H715" class="line"/>
  <rect x="726" y="228" width="174" height="97" rx="12" class="box"/>
  <text x="813" y="264" text-anchor="middle" class="heading" font-size="18">Local HTTP proxy</text>
  <text x="813" y="291" text-anchor="middle" class="muted">127.0.0.1:port</text>
  <path d="M901 276 H941" class="line"/>
  <rect x="952" y="228" width="128" height="97" rx="12" class="box"/>
  <text x="1016" y="264" text-anchor="middle" class="heading" font-size="18">Upstream</text>
  <text x="1016" y="291" text-anchor="middle" class="muted">Your routing</text>
  <path d="M40 356 H1080" stroke="#355266"/>
  <text x="40" y="386" fill="#efc784" font-size="14" font-weight="650">OUTSIDE THIS BOUNDARY</text>
  <text x="40" y="413" class="muted">Unlisted children • delegated DNS • proxy fallback • file access • administrators</text>
  <text x="1080" y="437" text-anchor="end" class="small">Architecture illustration — not a test result</text>
</svg>
