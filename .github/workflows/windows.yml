name: Windows build
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - shell: powershell
        run: ./scripts/Build.ps1
      - shell: powershell
        run: ./tests/Test-Static.ps1
